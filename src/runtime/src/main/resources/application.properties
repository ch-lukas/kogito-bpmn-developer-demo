# ---------------------------------------------------------------------------
# Kogito dev services + KIE Management Console wiring
# ---------------------------------------------------------------------------
quarkus.kogito.devservices.enabled=true
# Legacy property name some add-ons still consult.
kogito.devservices.enabled=false

# Tell the runtime to advertise the cors-proxy URL as its public address.
# The data-index bakes this into ProcessInstance.serviceUrl, and the
# Management Console filters its lists by that field. It must match the URL
# you enter in the console's "Connect to a runtime" dialog (i.e. the proxy).
kogito.service.url=http://localhost:8090

# ---------------------------------------------------------------------------
# CORS — allow the Management Console (port 8280) to call the runtime
# directly. The cors-proxy on 8090 also injects CORS, so this is
# belt-and-braces.
# ---------------------------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=content-disposition
quarkus.http.cors.access-control-allow-credentials=true

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
